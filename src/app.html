<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<title>Dream Console</title>
		<!-- Google Fonts load non-blocking and degrade to fallback fonts if they fail -->
		<link
			href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;500;600;700&family=Share+Tech+Mono&display=swap"
			rel="stylesheet"
			media="print"
			onload="this.media='all'"
			onerror="this.remove(); console.warn('Failed to load Google Fonts, using fallback fonts')"
		/>
		%sveltekit.head%
	</head>
	<body>
		<main>%sveltekit.body%</main>
	</body>
</html>
